# Templates are filled with concepts from the lists below.
# {c} is one concept, {a} and {b} are a pair.
templates:
  easy:
    - "Define {c} and give one example."
    - "What do you mean by {c}?"
    - "State the purpose of {c}."
    - "List the key features of {c}."
    - "Write a short note on {c}."
  medium:
    - "Explain {c} with an example."
    - "Explain the significance of {c}."
    - "Describe {c} with a neat diagram."
    - "Explain the working of {c}."
  hard:
    - "Discuss {c} in detail with a suitable example."
    - "Analyze the advantages and limitations of {c}."
    - "Evaluate the importance of {c} in practice."
  pair_medium:
    - "Differentiate between {a} and {b}."
    - "Compare {a} and {b}."

